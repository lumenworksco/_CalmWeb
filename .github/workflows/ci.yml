name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Links resolve and nothing loads from third parties
        run: python3 scripts/check-site.py

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Core logic, proof-of-work and Worker tests
        run: node --test tests/*.test.mjs
      - name: Admin bundle assembles
        run: bash scripts/assemble-admin.sh

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Migration, row-level security and anonymity tests
        run: bash supabase/tests/run.sh
